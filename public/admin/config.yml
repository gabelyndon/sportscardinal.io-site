# Decap CMS configuration.
#
# TODO(auth backend): the `backend` section below is a placeholder and
# WILL NOT WORK until oauth-worker/ is deployed and its GitHub OAuth App
# is registered — see oauth-worker/README.md for the full walkthrough
# (Netlify Identity + Git Gateway is deprecated, so we're not using that).
#
# Once oauth-worker/README.md's setup is complete, replace the `backend:`
# block below with:
#
#   backend:
#     name: github
#     repo: gabelyndon/sportscardinal.io-site
#     branch: main
#     base_url: https://sportscardinal-cms-auth.gabelyndon.workers.dev
#
# and change site_url below to the real site URL.

backend:
  name: git-gateway # placeholder only — see TODO above, this is not configured

# Where the CMS commits go and how the built site finds them.
site_url: https://sportscardinal-io-site.gabelyndon.workers.dev
media_folder: "src/content/blog/images"
public_folder: "/blog/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - {
          label: "URL Slug",
          name: "slug",
          widget: "string",
          required: false,
          hint: "Optional — overrides the filename-based URL. Leave blank to use the filename.",
        }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - {
          label: "Tags",
          name: "tags",
          widget: "list",
          default: [],
          required: false,
        }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - {
          label: "Hero Image",
          name: "heroImage",
          widget: "image",
          required: false,
        }
      - { label: "Body", name: "body", widget: "markdown" }
