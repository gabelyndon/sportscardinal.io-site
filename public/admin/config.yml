# Decap CMS configuration.
#
# Auth: GitHub via oauth-worker/ (a vendored sveltia-cms-auth Cloudflare
# Worker — see oauth-worker/README.md), not Netlify Identity/Git Gateway
# (deprecated).

backend:
  name: github
  repo: gabelyndon/sportscardinal.io-site
  branch: main
  base_url: https://sportscardinal-cms-auth.gabelyndon.workers.dev

# Where the CMS commits go and how the built site finds them.
site_url: https://sportscardinal-io-site.gabelyndon.workers.dev
media_folder: "src/content/blog/images"
public_folder: "/blog/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - {
          label: "URL Slug",
          name: "slug",
          widget: "string",
          required: false,
          hint: "Optional — overrides the filename-based URL. Leave blank to use the filename.",
        }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - {
          label: "Tags",
          name: "tags",
          widget: "list",
          default: [],
          required: false,
        }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - {
          label: "Hero Image",
          name: "heroImage",
          widget: "image",
          required: false,
        }
      - { label: "Body", name: "body", widget: "markdown" }
